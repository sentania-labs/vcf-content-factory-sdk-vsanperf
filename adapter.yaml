# adapter.yaml: pak metadata for VCF Content Factory vSAN Performance.
#
#   adapter_kind  MUST equal the AdapterKind key in describe.xml and
#                 ADAPTER_KIND in VsanPerfAdapter.java.
#   build_number  bump on every build; CHANGELOG.md gets a matching line.
#   released      false while authoring; the official release is the .pak
#                 CI builds on a v* git tag.
#
# Design: factory knowledge/designs/vsanperf-mp-v1.md (Build 1).
adapter_kind: vcfcf_vsanperf
entry_class: com.vcfcf.adapters.vsanperf.VsanPerfAdapter
name: VCF Content Factory vSAN Performance
description: >
  vSAN Performance Service metrics for DOM client, DOM owner and vSAN
  physical NICs, read over the vSphere JSON API (one wildcard query per
  entity type per cluster, a bounded pool across clusters) and stitched
  onto the vCenter adapter's own VMWARE HostSystem objects as instanced
  keys under "vSAN Perf". Creates no objects besides its adapter instance.
  Replaces the Python vsanhostmetrics pack at scale; distinct adapter kind,
  so the two run side by side.
version: "1.0.0"
build_number: 9
tier: 2
released: false
